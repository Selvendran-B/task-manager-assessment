<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <link rel="stylesheet"
          href="/static/style.css">

    <script src="https://accounts.google.com/gsi/client"
            async
            defer></script>
</head>

<body>

<!-- LOGIN -->

<div id="login" class="card">

    <div class="login-icon">
        ✓
    </div>

    <h1>Task Manager</h1>

    <p class="login-subtitle">
        Organize your work and keep track of your progress.
    </p>

    <div id="g_id_onload"
         data-client_id="101170250942-cf87tr6rr7i12sis9ioorihc477m6o31.apps.googleusercontent.com"
         data-callback="handleGoogleLogin"
         data-auto_prompt="false">
    </div>

    <div class="google-login">

        <div class="g_id_signin"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="signin_with">
        </div>

    </div>

</div>


<!-- APPLICATION -->

<div id="app">

    <!-- HEADER -->

    <div class="card header">

        <div>

            <h1>Task Manager</h1>

            <p id="userInfo"
               class="user-info">
            </p>

        </div>

        <button class="logout"
                onclick="logout()">
            Logout
        </button>

    </div>


    <!-- SUMMARY -->

    <div class="summary-grid">

        <div class="summary-card">

            <div class="summary-label">
                Total Tasks
            </div>

            <div id="totalCount"
                 class="summary-number">
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Planned
            </div>

            <div id="plannedCount"
                 class="summary-number">
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                In Progress
            </div>

            <div id="progressCount"
                 class="summary-number">
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Complete
            </div>

            <div id="completeCount"
                 class="summary-number">
                0
            </div>

        </div>

    </div>


    <!-- CREATE TASK -->

    <div class="card">

        <h2>Create Task</h2>

        <input
            id="title"
            type="text"
            maxlength="100"
            placeholder="What needs to be done?"
        >

        <textarea
            id="description"
            maxlength="500"
            placeholder="Add a description (optional)"
        ></textarea>

        <button
            id="createButton"
            class="create-button"
            onclick="createTask()">
            Create Task
        </button>

    </div>


    <!-- TASK LIST -->

    <div class="card">

        <h2>My Tasks</h2>

        <div class="task-controls">

            <input
                id="search"
                type="search"
                placeholder="Search tasks..."
            >

            <select id="statusFilter">

                <option value="All">
                    All statuses
                </option>

                <option value="Planned">
                    Planned
                </option>

                <option value="In Progress">
                    In Progress
                </option>

                <option value="Complete">
                    Complete
                </option>

            </select>

        </div>

        <div id="tasks"></div>

    </div>

</div>


<!-- TOAST -->

<div id="toast"
     class="toast">
</div>


<script src="/static/script.js"></script>

</body>

</html>
